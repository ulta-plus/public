name: Staticfiles Deploy

on:
  push:
    branches:
      - main

env:
  # GitHub Actions Variables:
  #   ALLOWED_DIRS — reused from GCP/Yandex deploys: comma-separated list of directories to deploy
  #                  all files from each directory are uploaded on every push
  #   STATICFILES_SSH_USER — SSH username for the server
  # GitHub Actions Secrets:
  #   STATICFILES_DEPLOY_KEY — private SSH key (analog of pac-generator-deploy-key in Jenkins)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build file list
        id: filelist
        env:
          ALLOWED_DIRS: ${{ vars.ALLOWED_DIRS }}
        run: |
          if [ -z "$ALLOWED_DIRS" ]; then
            echo "ALLOWED_DIRS is empty, nothing to deploy"
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIRS_RAW="${ALLOWED_DIRS//$'\n'/,}"
          IFS=',' read -ra DIRS <<< "$DIRS_RAW"

          FILES_TO_DEPLOY=""
          for dir in "${DIRS[@]}"; do
            dir="$(echo "$dir" | tr -d '[:space:]' | sed 's|^/||; s|/$||')"
            [ -z "$dir" ] && continue
            if [ -d "$dir" ]; then
              FILES_TO_DEPLOY="$FILES_TO_DEPLOY $(find "$dir" -type f | tr '\n' ' ')"
            else
              echo "Warning: directory '$dir' not found, skipping"
            fi
          done
          FILES_TO_DEPLOY="${FILES_TO_DEPLOY# }"

          if [ -z "$FILES_TO_DEPLOY" ]; then
            echo "No files found in specified directories"
          else
            echo "Files to deploy: $FILES_TO_DEPLOY"
          fi
          echo "files=$FILES_TO_DEPLOY" >> $GITHUB_OUTPUT

      - name: Deploy to staticfiles servers
        if: steps.filelist.outputs.files != ''
        env:
          SSH_KEY: ${{ secrets.STATICFILES_DEPLOY_KEY }}
          SSH_USER: ${{ vars.STATICFILES_SSH_USER }}
          DEPLOY_FILES: ${{ steps.filelist.outputs.files }}
        run: |
          if [ -z "$SSH_USER" ]; then
            echo "STATICFILES_SSH_USER variable is not set"
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "STATICFILES_DEPLOY_KEY secret is not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/id_ed25519\n' > ~/.ssh/config

          HOSTS="185.218.0.121 217.114.15.131"

          BATCH=/tmp/sftp_batch.txt
          > "$BATCH"
          for file in $DEPLOY_FILES; do
            segment="files"
            IFS='/' read -ra parts <<< "$(dirname "$file")"
            for part in "${parts[@]}"; do
              [ "$part" = "." ] && continue
              segment="$segment/$part"
              printf 'mkdir %s\n' "$segment" >> "$BATCH"
            done
            printf 'put %s files/%s\n' "$file" "$file" >> "$BATCH"
          done

          echo "SFTP batch:"
          cat "$BATCH"

          for host in $HOSTS; do
            echo "Deploying to $host..."
            sftp -b "$BATCH" "${SSH_USER}@${host}"
            echo "Done: $host"
          done

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519 /tmp/sftp_batch.txt
