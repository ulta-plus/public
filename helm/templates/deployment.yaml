apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.projectName }}-app
  labels:
    environment: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.projectName }}-app
  template:
    metadata:
      labels:
        app: {{ .Values.projectName }}-app
        environment: {{ .Values.environment }}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: {{ .Values.projectName }}-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: 8080
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /liveness
              port: web
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /liveness
              port: web
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
